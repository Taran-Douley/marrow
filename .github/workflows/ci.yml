name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --workspace mcp/level-forge
      - run: npm test
      - run: node scripts/check-claims.mjs
      # Games use only the kit's public API, and every object file is wired in.
      - run: node scripts/check-imports.mjs
      - run: node scripts/wire-objects.mjs && git diff --exit-code -- apps/*/src/objects apps/*/test/objects.generated.test.ts
      - run: node scripts/setup.mjs --no-start
      # The power is rebuilt by the tests; fail if the committed copy is out of date. The bundled MCP
      # server is left out: the bundler orders modules differently on Linux and Windows, same code.
      - run: git diff --exit-code -- power/marrow ':!power/marrow/mcp/level-forge.js' ':!power/marrow/mcp/advisor.js'
