name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --workspace mcp/level-forge
      - run: npm test
      - run: node scripts/check-claims.mjs
      # The power is rebuilt by the tests; fail if the committed copy is out of date.
      - run: git diff --exit-code -- power/marrow
