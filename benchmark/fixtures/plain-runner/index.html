<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Plain runner (audit control)</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
      button:focus { outline: none; }
    </style>
  </head>
  <body>
    <!--
      A deliberately ordinary game, written the way many small web games are: it is NOT a "without the
      power" result. It is a control for the audit, to show the audit fails what it should fail.
    -->
    <canvas id="c" width="640" height="200"></canvas>
    <p id="msg"></p>
    <script>
      const ctx = document.getElementById('c').getContext('2d');
      const msg = document.getElementById('msg');
      let y = 0, vy = 0, x = 640, alive = true, lives = 3;
      const audio = new AudioContext();
      function beep(hz) {
        const o = audio.createOscillator();
        o.frequency.value = hz;
        o.connect(audio.destination);
        o.start();
        o.stop(audio.currentTime + 0.1);
      }
      window.addEventListener('keydown', (e) => {
        e.preventDefault();
        if (e.code === 'Space' && y === 0) { vy = 12; beep(660); }
      });
      function frame() {
        if (alive) {
          x -= 6; if (x < -20) { x = 640; beep(220); }
          vy -= 0.8; y = Math.max(0, y + vy);
          if (x < 60 && x > 20 && y < 20) {
            lives -= 1; beep(110); x = 640;
            msg.textContent = 'Lives left: ' + lives;
            if (lives === 0) { alive = false; msg.textContent = 'GAME OVER'; }
          }
        }
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, 640, 200);
        ctx.fillStyle = '#e33'; ctx.fillRect(x, 170, 20, 30);
        ctx.fillStyle = '#3e3'; ctx.fillRect(40, 170 - y, 20, 30);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
